before:
  hooks:
    - go mod tidy
builds:
  - binary: coolify
    ldflags:
      - -X github.com/coollabsio/coolify-cli/internal/version.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    # Build all platforms in parallel using all available CPU cores
    parallelism: -1