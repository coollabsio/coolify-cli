version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: coolify
    binary: coolify
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X github.com/coollabsio/coolify-cli/internal/version.version={{ .Version }}
    main: ./coolify/main.go
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

checksum:
  name_template: checksums.txt
  algorithm: sha256

archives:
  - id: coolify-archive
    builds:
      - coolify
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

    format_overrides:
      - goos: windows
        formats: [zip]