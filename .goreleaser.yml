before:
  hooks:
    - go mod tidy
builds:
  - binary: coolify
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/coollabsio/coolify-cli/cmd/runtime.Version={{.Version}}
    env:
      - CGO_ENABLED=0
archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_{{ .Arch }}
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'